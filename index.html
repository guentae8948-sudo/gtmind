<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef0f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마인드맵">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>마인드맵</title>
<style>
:root{--ac:#3b82f6;--bd:#e3e6ec;--tx:#1d2433;--mut:#6b7385;--bg:#f6f7f9;--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--tx);background:#fff;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;background:#eef0f4;border-bottom:1px solid var(--bd);min-height:40px}
#tablist{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
#tablist::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;border-bottom:none;background:transparent;padding:7px 12px;border-radius:8px 8px 0 0;font-size:13px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.tab.on{background:#fff;border-color:var(--bd);color:var(--tx);font-weight:600;position:relative;top:1px}
.tab.on2{color:var(--ac)}
.tab.on2::before{content:"◧ ";font-size:11px}
.tab.add{font-size:16px;padding:4px 10px;color:var(--mut)}
#sync{font-size:11px;color:var(--mut);white-space:nowrap;padding:0 4px 6px}
#toolbar{display:flex;align-items:center;gap:2px;padding:5px 6px;border-bottom:1px solid var(--bd);overflow-x:auto;background:#fff;scrollbar-width:none;flex-shrink:0}
#toolbar::-webkit-scrollbar{display:none}
.tb{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 9px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0}
.tb:hover{background:#f1f3f6}
.tb[aria-pressed="true"]{background:#e7efff;color:#1d4ed8;border-color:#c9dafc}
.tb:disabled{opacity:.35;cursor:default}
.tb .k{font-size:10px;color:var(--mut);border:1px solid var(--bd);border-radius:4px;padding:0 3px}
.sep{width:1px;height:22px;background:var(--bd);margin:0 4px;flex-shrink:0}
#layoutSel{font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:7px;padding:5px 6px;background:#fff;flex-shrink:0}
#fsLabel{font-size:12px;min-width:38px;text-align:center;color:var(--mut);flex-shrink:0}
#main{flex:1;display:flex;min-height:0;position:relative}
#panes{flex:1;display:flex;min-width:0}
.pane{flex:1;position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(#d9dde5 1px,transparent 1px);background-size:22px 22px;min-width:0;min-height:0}
.pane+.pane{border-left:1px solid var(--bd)}
#panes.split .pane.focus{box-shadow:inset 0 0 0 2px var(--ac)}
.canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.node{cursor:pointer}
.pane-label{position:absolute;left:10px;top:8px;font-size:12px;background:rgba(255,255,255,.9);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;display:none;pointer-events:none;z-index:2}
#panes.split .pane-label{display:block}
.zoombar{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.06);z-index:2}
.zoombar button{border:none;background:none;padding:6px 10px;font-size:14px}
.zoombar .zl{font-size:11px;color:var(--mut);min-width:40px;text-align:center}
.mini{position:absolute;right:10px;bottom:10px;width:180px;height:120px;background:rgba(255,255,255,.92);border:1px solid var(--bd);border-radius:9px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:2;touch-action:none}
.mini svg{width:100%;height:100%;display:block}
.nomini .mini{display:none}
#panel{width:310px;border-left:1px solid var(--bd);background:#fff;overflow-y:auto;padding:12px 14px 30px;display:none;flex-shrink:0}
#panel.open{display:block}
#panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#panel .ph b{font-size:14px}
#panel label{display:block;font-size:12px;font-weight:600;color:#3d4556;margin:12px 0 5px}
#panel textarea,#panel input[type=text],#panel input:not([type]){width:100%;font:inherit;font-size:14px;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;resize:vertical}
#panel textarea:focus,#panel input:focus{outline:2px solid #bfd3fb;border-color:var(--ac)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.btn:hover{background:#f4f6f9}
.btn.danger{color:#c92a2a;border-color:#f3c4c4}
.btn.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.muted{color:var(--mut);font-size:12px;font-weight:400}
#pColors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--tx)}
.sw.auto{background:conic-gradient(#e8590c,#f59f00,#2f9e44,#1c7ed6,#ae3ec9,#e8590c);}
#pColorCustom{width:28px;height:26px;border:none;padding:0;background:none}
.file-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--bd)}
.file-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{display:flex!important;align-items:center;gap:6px}
#pImgThumb{max-width:100%;max-height:120px;border-radius:6px;display:none;margin-top:6px}
#pLinkOpen{font-size:13px;color:var(--ac);white-space:nowrap}
#editor{position:fixed;display:none;z-index:50;border:2px solid var(--ac);border-radius:8px;padding:4px 8px;resize:none;text-align:center;background:#fff;font-family:var(--font);line-height:1.35;box-shadow:0 4px 16px rgba(0,0,0,.15);overflow:hidden}
#modal{position:fixed;inset:0;background:rgba(20,24,33,.38);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#modal h3{margin:0 0 12px;font-size:16px}
#modal .menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:11px 8px;border-radius:8px;font-size:14px}
#modal .menu button:hover{background:#f2f4f7}
#modal .menu .hd{font-size:11px;color:var(--mut);padding:10px 8px 2px;font-weight:600}
#modal input,#modal textarea{width:100%;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#modal table{font-size:13px;border-collapse:collapse;width:100%}
#modal td{padding:5px 4px;border-bottom:1px solid #f0f1f4}
#modal td:first-child{white-space:nowrap;font-family:ui-monospace,monospace;font-size:12px;color:#384152}
#modal input[type=radio],#modal input[type=checkbox]{width:auto}
#searchbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(480px,calc(100% - 20px));background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:8px;display:none;z-index:20}
#searchbar.on{display:block}
#searchbar .srow{display:flex;gap:6px;align-items:center}
#sInput{flex:1;min-width:0;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
#sCount{white-space:nowrap}
#sTags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;max-height:64px;overflow:auto}
#sTags:empty{display:none}
.tagchip{font-size:12px;border:1px solid #d0d7e2;background:#f4f6fa;border-radius:12px;padding:3px 9px;color:#3d4556}
#quizbar{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:8px 10px;display:none;flex-direction:column;gap:7px;z-index:20;width:max-content;max-width:calc(100% - 16px)}
#quizbar.on{display:flex}
#quizbar .qrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#quizbar button{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 11px;font-size:14px;white-space:nowrap}
#quizbar .small button{font-size:12px;padding:5px 9px;color:var(--mut)}
#quizbar .mk-o{color:#2b8a3e;border-color:#b2f2bb;background:#f4fcf5}
#quizbar .mk-t{color:#c77700;border-color:#ffe08a;background:#fffbea}
#quizbar .mk-x{color:#c92a2a;border-color:#ffc9c9;background:#fff5f5}
#quizbar .pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#qstat{font-size:12px;color:#3d4556;text-align:center}
body.quizon #toast{bottom:auto;top:100px}
@media (max-width:760px){
  #quizbar{bottom:10px;padding:7px 8px;gap:6px}
  #quizbar button{padding:7px 9px;font-size:13px}
  #quizbar .lbl{display:none}
  #quizbar .small button{font-size:11px;padding:4px 7px}
  body.quizon .mini,body.quizon .zoombar{display:none}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2633;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#tabs{padding-top:calc(6px + env(safe-area-inset-top));padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}
#app{padding-bottom:env(safe-area-inset-bottom)}
#panel{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@media (max-width:760px){
  .tb .k{display:none}
  #panes.split{flex-direction:column}
  .pane+.pane{border-left:none;border-top:1px solid var(--bd)}
  .mini{width:120px;height:82px}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:58vh;border-left:none;border-top:1px solid var(--bd);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);z-index:30}
}
</style>
</head>
<body>
<div id="app">
  <div id="tabs"><div id="tablist"></div><span id="sync">기기 저장</span></div>
  <div id="toolbar">
    <button class="tb" data-act="child" title="자식 추가 (Tab)">＋ 자식 <span class="k">Tab</span></button>
    <button class="tb" data-act="sibling" title="형제 추가 (Enter)">＋ 형제 <span class="k">Enter</span></button>
    <button class="tb" data-act="edit" title="편집 (F2 / 더블탭)">✎ 편집</button>
    <button class="tb" data-act="del" title="삭제 (Delete)">🗑 삭제</button>
    <span class="sep"></span>
    <button class="tb" data-act="undo" title="실행 취소 (Ctrl+Z)">↶</button>
    <button class="tb" data-act="redo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    <span class="sep"></span>
    <button class="tb" data-act="quiz" title="목차 암기 모드: 하위 주제를 가리고 하나씩 확인">🧠 암기 모드</button>
    <button class="tb" data-act="search" title="검색 · 태그 (Ctrl+F)">🔍 검색</button>
    <span class="sep"></span>
    <select id="layoutSel" title="레이아웃">
      <option value="right">→ 오른쪽</option>
      <option value="left">← 왼쪽</option>
      <option value="balanced">⇆ 양쪽 균형</option>
      <option value="org">⊤ 조직도</option>
      <option value="logic">⊢ 로직 트리</option>
    </select>
    <span class="sep"></span>
    <button class="tb" data-act="fontDown" title="전체 글씨 작게">A−</button>
    <span id="fsLabel">100%</span>
    <button class="tb" data-act="fontUp" title="전체 글씨 크게">A+</button>
    <button class="tb" data-act="notes" title="주제 아래에 설명(노트) 표시">📝 설명 보기</button>
    <span class="sep"></span>
    <button class="tb" data-act="rel" title="관계선: 시작 주제 선택 후 누르고 대상 탭">↝ 관계선</button>
    <button class="tb" data-act="group" title="선택 주제와 하위를 그룹으로 묶기">▢ 그룹</button>
    <button class="tb" data-act="collapse" title="하위 접기/펼치기">⊖ 접기</button>
    <span class="sep"></span>
    <button class="tb" data-act="mini" title="미니맵">🗺 미니맵</button>
    <button class="tb" data-act="split" title="2분할 보기">◧ 2분할</button>
    <button class="tb" data-act="panel" title="속성 패널 (노트·색상·첨부)">☰ 속성</button>
    <button class="tb" data-act="menu" title="내보내기 / 가져오기">⋯ 메뉴</button>
  </div>
  <div id="main">
    <div id="panes"></div>
    <div id="searchbar">
      <div class="srow"><input id="sInput" type="search" placeholder="검색어 또는 #태그 (예: 수용 #2019기출)" autocomplete="off"><span id="sCount" class="muted"></span><button class="btn" id="sPrev" title="이전">▲</button><button class="btn" id="sNext" title="다음">▼</button><button class="btn" id="sClose" title="닫기">✕</button></div>
      <div id="sTags"></div>
    </div>
    <div id="quizbar">
      <div class="qrow"><span id="qstat"></span></div>
      <div class="qrow"><button id="qPrev" title="이전 빈칸">◀</button><button id="qReveal" class="pri">공개</button><button id="qNext" title="다음 빈칸 (Space)">다음 ▶</button><span style="width:6px"></span><button class="mk-o" data-mark="o" title="알아 (1)">⭕<span class="lbl"> 알아</span></button><button class="mk-t" data-mark="t" title="애매 (2)">△<span class="lbl"> 애매</span></button><button class="mk-x" data-mark="x" title="몰라 (3)">❌<span class="lbl"> 몰라</span></button></div>
      <div class="qrow small"><button id="qWeak">❌△만 다시</button><button id="qReset">처음부터 다시</button><button id="qAll">모두 공개</button><button id="qClear">기록 지우기</button><button id="qExit">종료</button></div>
    </div>
    <aside id="panel">
      <div class="ph"><b id="pTitle">속성</b><button class="btn" data-act="panel">닫기</button></div>
      <div id="pEmpty" class="muted">주제를 탭해서 선택하세요.</div>
      <div id="pNodeSec">
        <label>주제</label>
        <textarea id="pText" rows="2"></textarea>
        <label>설명(노트) <span class="muted">— 맵에서 주제 아래에 표시돼요</span></label>
        <textarea id="pNote" rows="4" placeholder="설명을 입력하세요"></textarea>
        <label>태그 <span class="muted">— 띄어쓰기로 구분</span></label>
        <input id="pTags" type="text" placeholder="#2019기출 #빈출">
        <div id="pMark" class="muted" style="margin-top:6px"></div>
        <label>색상</label>
        <div id="pColors"></div>
        <label>이 주제 글씨 크기</label>
        <div class="row"><button class="btn" id="pFsDown">A−</button><span id="pFs" class="muted">100%</span><button class="btn" id="pFsUp">A+</button><button class="btn" id="pFsReset">기본값</button></div>
        <label>링크</label>
        <div class="row" style="flex-wrap:nowrap"><input id="pLink" type="text" placeholder="https://…"><a id="pLinkOpen" target="_blank" rel="noopener">열기</a></div>
        <label>이미지</label>
        <div class="row"><button class="btn" id="pImgAdd">이미지 추가</button><button class="btn danger" id="pImgDel">제거</button></div>
        <img id="pImgThumb" alt="">
        <label>첨부 파일</label>
        <div id="pFiles"></div>
        <div class="row" style="margin-top:6px"><button class="btn" id="pFileAdd">＋ 파일 첨부</button></div>
        <label class="chk"><input type="checkbox" id="pGroup"> 노드 그룹 (이 주제 + 하위를 묶음)</label>
        <input id="pGroupLabel" type="text" placeholder="그룹 이름 (선택)">
        <div class="row" style="margin-top:16px"><button class="btn" id="pCollapse">접기/펼치기</button><button class="btn danger" id="pDelete">주제 삭제</button></div>
      </div>
      <div id="pRelSec">
        <label>관계선 라벨</label>
        <input id="pRelLabel" type="text" placeholder="예: 원인, 비교, 참고">
        <div class="row" style="margin-top:10px"><button class="btn" id="pRelFlip">방향 바꾸기</button><button class="btn danger" id="pRelDel">관계선 삭제</button></div>
      </div>
    </aside>
  </div>
</div>
<textarea id="editor" spellcheck="false"></textarea>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fFile" hidden>
<input type="file" id="fImport" accept=".xmind,.json,application/json" hidden>

<script>
'use strict';
/* ================= 기본 상수 / 유틸 ================= */
const FONT = `-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif`;
const PALETTE = ['#e8590c','#1c7ed6','#2f9e44','#ae3ec9','#f59f00','#0ca678','#d6336c','#4263eb','#74b816','#495057'];
const ROOT_COLOR = '#2b3a55';
const LAYOUT_NAMES = {right:'오른쪽', left:'왼쪽', balanced:'양쪽 균형', org:'조직도', logic:'로직 트리'};
const CLOUD_MAX = 240000;
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
function hexRgb(h){ h = (h || '#888').replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function tint(hex, a){ const [r,g,b] = hexRgb(hex); const f = v => Math.round(v + (255 - v) * a); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function lum(hex){ const [r,g,b] = hexRgb(hex); return (0.299*r + 0.587*g + 0.114*b) / 255; }
function toast(msg, ms = 2200){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function fmtSize(n){ return n > 1048576 ? (n/1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n/1024)) + 'KB'; }

/* ================= 상태 ================= */
const S = { maps:{}, order:[], deleted:[], active:null, pane2:null, focus:0,
  settings:{ fontScale:1, showNotes:true, minimap:true, split:false, panel:false } };
const hist = {};
const dirty = new Set(), delPending = new Set(), attPending = new Set();
let indexDirty = false;
const attCache = {}, attLoading = new Set();
let relMode = null;

function newNode(text){ return { id: uid(), text: text ?? '', children: [] }; }
function newMap(name){ const root = newNode(name || '중심 주제'); return { id: uid(), name: name || '새 마인드맵', root, relations: [], layout: 'balanced', updatedAt: Date.now() }; }
function sampleMap(){
  const m = newMap('시작하기'); m.root.text = '마인드맵 사용법'; m._sample = true;

function lighterSide(p){ let r = 0, l = 0; const map = curMap(p); for (const k of map.root.children){ const b = p.L && p.L.get(k.id); if (!b) continue; if (b.side < 0) l += b.sh || b.h; else r += b.sh || b.h; } return r <= l ? 'R' : 'L'; }
function quizBlock(p){ if (quizOn(p)){ toast('암기 모드에서는 편집할 수 없어요 (종료 후 편집)'); return true; } return false; }
function addChild(p){
  const map = curMap(p); if (!map || quizBlock(p)) return; commitEditor();
  const id = p.sel || map.root.id; const info = getIndex(map).get(id); if (!info) return;
  const c = newNode('새 주제');
  if (info.n === map.root && map.layout === 'balanced') c.side = lighterSide(p);
  mutate(map, () => { info.n.collapsed = false; info.n.children.push(c); p.sel = c.id; p.selRel = null; });
  openEditor(p, c.id, { selectAll: true });
}
function addSibling(p){
  const map = curMap(p); if (!map || quizBlock(p)) return; commitEditor();
  if (!p.sel){ p.sel = map.root.id; renderAll(); return; }
  const info = getIndex(map).get(p.sel); if (!info || !info.p) return addChild(p);
  const c = newNode('새 주제');
  if (info.p === map.root && map.layout === 'balanced'){ const b = p.L.get(info.n.id); c.side = b && b.side < 0 ? 'L' : 'R'; }
  mutate(map, () => { const arr = info.p.children; arr.splice(arr.indexOf(info.n) + 1, 0, c); p.sel = c.id; p.selRel = null; });
  openEditor(p, c.id, { selectAll: true });
}
function delSel(p){
  const map = curMap(p); if (!map || quizBlock(p)) return;
  if (p.selRel){ const rid = p.selRel; mutate(map, () => { map.relations = map.relations.filter(r => r.id !== rid); p.selRel = null; }); return; }
  if (!p.sel) return; const info = getIndex(map).get(p.sel);
  if (!info || !info.p){ toast('중심 주제는 삭제할 수 없어요'); return; }
  const ids = subtreeIds(info.n);
  mutate(map, () => {
    const arr = info.p.children, i = arr.indexOf(info.n); arr.splice(i, 1);
    map.relations = (map.relations || []).filter(r => !ids.has(r.from) && !ids.has(r.to));
    p.sel = (arr[i] || arr[i - 1] || info.p).id;
  });
}
function toggleCollapse(p){ const map = curMap(p); const info = p.sel && getIndex(map).get(p.sel); if (!info || !info.n.children.length || !info.p) return; mutate(map, () => { info.n.collapsed = !info.n.collapsed; }); }
function navigate(p, key){
  const map = curMap(p); if (!map || !p.L) return;
  if (!p.sel){ p.sel = map.root.id; renderAll(); return; }
  const b = p.L.get(p.sel); if (!b) return;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2; let best = null, bs = Infinity;
  for (const [id, o] of p.L){
    if (id === p.sel) continue;
    const dx = o.x + o.w / 2 - cx, dy = o.y + o.h / 2 - cy;
    let pr, se;
    if (key === 'ArrowRight'){ pr = dx; se = dy; } else if (key === 'ArrowLeft'){ pr = -dx; se = dy; } else if (key === 'ArrowDown'){ pr = dy; se = dx; } else { pr = -dy; se = dx; }
    if (pr <= 4) continue; const sc = pr + Math.abs(se) * 2.2; if (sc < bs){ bs = sc; best = id; }
  }
  if (best){ p.sel = best; renderAll(); ensureVisible(p, best); }
}

/* 텍스트 편집기 */
const editor = $('#editor'); let edit = null;

function openEditor(p, id, o = {}){
  if (edit) commitEditor();

  const b = p.L && p.L.get(id); if (!b) return;

  const fs = Math.max(15, b.m.fs * v.k); const w = Math.max(b.w * v.k + 16, 180);

/* 키보드 */
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('open')){ if (e.key === 'Escape') closeModal(); return; }
  const t = e.target; if (t === editor) return;
  if (t && t.matches && t.matches('input,textarea,select,[contenteditable]')) return;
  const p = fp(); const mod = e.ctrlKey || e.metaKey; const k = e.key;
  if (mod && (k === 'z' || k === 'Z')){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (k === 'y' || k === 'Y')){ e.preventDefault(); redo(); return; }
  if (mod && (k === 'f' || k === 'F')){ e.preventDefault(); openSearch(); return; }
  if (mod && k === '0'){ e.preventDefault(); fitPane(p); return; }
  if (!mod && !e.altKey && quizOn(p)){
    if (k === ' ' || k === 'Enter'){ e.preventDefault(); quizRevealOrNext(p); }

  }

  if (mod && k === '-'){ e.preventDefault(); zoomAt(p, 0.83); return; }

    case 'Enter': e.preventDefault(); addSibling(p); return;
    case 'Delete': case 'Backspace': if (p.sel || p.selRel){ e.preventDefault(); delSel(p); } return;
    case 'F2': case ' ': if (p.sel){ e.preventDefault(); openEditor(p, p.sel); } return;
    case 'Escape': relMode = null; p.sel = null; p.selRel = null; renderAll(); return;
    case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': e.preventDefault(); navigate(p, k); return;
  }
  if (p.sel && (k.length === 1 || k === 'Process' || e.keyCode === 229)){
    if (k.length === 1){ e.preventDefault(); openEditor(p, p.sel, { text: k }); }
    else openEditor(p, p.sel, { text: '' });
  }
});

/* ================= 목차 암기 모드 ================= */
let quiz = null; // { mapId, revealed:Set, weak:bool }
function quizOn(p = fp()){ return !!(quiz && p && quiz.mapId === p.mapId); }
function isHidden(map, n, d){ return !!(quiz && quiz.mapId === map.id && d > 0 && !quiz.revealed.has(n.id) && (!quiz.weak || n.mark === 'x' || n.mark === 't')); }

function quizStats(map){ let tot = 0, o = 0, t = 0, x = 0; for (const v of getIndex(map).values()){ if (!v.p) continue; tot++; if (v.n.mark === 'o') o++; else if (v.n.mark === 't') t++; else if (v.n.mark === 'x') x++; } return { tot, o, t, x }; }
function quizStart(){
  const p = fp(), map = curMap(p); if (!map) return; commitEditor(); relMode = null;
  if (!map.root.children.length){ toast('하위 주제가 있어야 암기 모드를 쓸 수 있어요'); return; }
  quiz = { mapId: map.id, revealed: new Set(), weak: false };
  p.sel = map.root.id; p.selRel = null; renderAll(); fitPane(p);
  toast('주제를 떠올린 뒤 탭(또는 Space)해서 확인하고 ⭕△❌로 표시하세요', 3200);
}
function quizExit(){ quiz = null; renderAll(); }
function quizNext(p, dir = 1){
  const order = [...(p.L ? p.L.keys() : [])], hid = new Set(hiddenList(p)), map = curMap(p);
  if (!hid.size){ const s = quizStats(map); toast(`모두 확인했어요 · ⭕${s.o} △${s.t} ❌${s.x}`, 3000); renderAll(); return; }
  const i = Math.max(0, order.indexOf(p.sel));
  for (let s = 1; s <= order.length; s++){
    const id = order[((i + dir * s) % order.length + order.length) % order.length];
    if (hid.has(id)){ p.sel = id; p.selRel = null; renderAll(); centerOn(p, id); return; }
  }
}
function quizRevealOrNext(p){

}

  quizNext(p);
}

  const inp = $('#sInput'); inp.focus(); inp.select();

function closeSearch(){ search = null; $('#searchbar').classList.remove('on'); $('#sInput').blur(); renderAll(); }

  search.matches = []; search.i = -1;
  if (terms.length) for (const [id, v] of getIndex(map)){
    const n = v.n, hay = ((n.text || '') + '\n' + (n.note || '')).toLowerCase(), tags = (n.tags || []).map(t => t.toLowerCase());
    if (terms.every(t => t[0] === '#' ? (t.length === 1 ? tags.length > 0 : tags.some(g => g.startsWith(t.slice(1)))) : (hay.includes(t) || tags.some(g => g.includes(t))))) search.matches.push(id);
  }
  $('#sCount').textContent = terms.length ? (search.matches.length ? `${search.matches.length}개` : '없음') : '';

}

  if (changed) touch(map);
  p.sel = id; p.selRel = null; renderAll(); centerOn(p, id);
  $('#sCount').textContent = `${search.i + 1}/${search.matches.length}`;
}

  if (map) for (const v of getIndex(map).values()) for (const t of v.n.tags || []) cnt[t] = (cnt[t] || 0) + 1;
  $('#sTags').innerHTML = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b, 'ko')).map(t => `<button class="tagchip" data-tag="${esc(t)}">#${esc(t)} <span class="muted">${cnt[t]}</span></button>`).join('');
}
$('#sInput').addEventListener('input', e => { if (!search) return; search.q = e.target.value; runSearch(); });
$('#sInput').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter'){ e.preventDefault(); searchGo(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape'){ e.preventDefault(); closeSearch(); }

const OUTLINE_PATS = [

  ['circ', /^[①-⑳]\s*/], ['ga.', /^[가-하]\.\s*/], ['ga)', /^[가-하]\)\s*/], ['(ga)', /^\([가-하]\)\s*/],
  ['a.', /^[a-z]\.\s+/], ['a)', /^[a-z]\)\s+/], ['bullet', /^(?:[-*+•·▪◦○●■□▶►▷✓]|\d+\.\s*\[[ x]\])\s+/]

function parseOutline(text){
  const top = { key: -1, n: { children: [] } }, stack = [top], rank = {}; let next = 0, last = null, count = 0;
  for (const raw of String(text).replace(/\r/g, '').split('\n')){
    if (!raw.trim()) continue;
    const ws = raw.match(/^[\t 　]*/)[0]; const indent = ws.replace(/\t/g, '    ').replace(/　/g, '  ').length;
    let s = raw.slice(ws.length).trim();
    if (/^(```|---+|\*\*\*+)$/.test(s)) continue;
    if (s.startsWith('>') && last){ const t = s.replace(/^>\s?/, ''); last.note = (last.note ? last.note + '\n' : '') + t; continue; }
    let key, text = s; const h = s.match(/^(#{1,6})\s+(.*)$/);
    if (h){ key = h[1].length; text = h[2]; }
    else {
      let type = 'plain';
      for (const [t, re] of OUTLINE_PATS) if (re.test(s)){ type = t; if (t === 'bullet') text = s.replace(re, ''); break; }
      if (!(type in rank)) rank[type] = next++;

    text = text.replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1').replace(/`([^`]+)`/g, '$1').trim();

    const n = newNode(text); if (tags.length) n.tags = tags; count++;
    while (stack.length > 1 && stack[stack.length - 1].key >= key) stack.pop();
    stack[stack.length - 1].n.children.push(n); stack.push({ key, n }); last = n;

}

async function cloudPull(first){
  if (!col) return; if (first) setSync('loading');

    const [qs, ix] = await withTimeout(Promise.all([col.where('kind', '==', 'map').get(), col.doc('index').get()]), 12000);
    const idx = ix.exists ? ix.data() : null;
    const delSet = new Set([...(S.deleted || []), ...((idx && idx.deleted) || [])]);
    S.deleted = [...delSet].slice(-500);
    let changed = false; const remoteIds = new Set();
    if (qs.size && Object.values(S.maps).every(m => m._sample)){ for (const id of Object.keys(S.maps)){ delete S.maps[id]; S.order = S.order.filter(x => x !== id); } changed = true; }

      if (!m || !m.id) continue; remoteIds.add(m.id);
      if (delSet.has(m.id)){ delPending.add(m.id); continue; }

      if (!loc || (m.updatedAt || 0) > (loc.updatedAt || 0)){ delete m._v; S.maps[m.id] = m; delete hist[m.id]; changed = true; }

    if (changed){
      panes.forEach(p => { if (!S.maps[p.mapId]){ p.mapId = S.order[0]; p.sel = null; } });
      S.active = panes[0].mapId; S.pane2 = panes[1].mapId;

}
let pushing = false, pushAgain = false;
async function cloudPush(){
  if (!col) return; if (pushing){ pushAgain = true; return; }
  pushing = true; setSync('saving'); let ok = true;
  try {
    for (const id of [...dirty]){
      dirty.delete(id); const m = S.maps[id]; if (!m || m._sample) continue;
      const json = JSON.stringify(m, (k, v) => k === '_v' ? undefined : v);
      if (json.length > 250000){ toast(`“${m.name}”이(가) 너무 커서 이 기기에만 저장돼요`); continue; }
      try { await col.doc('m_' + id).set({ kind: 'map', updatedAt: m.updatedAt, json }); } catch(e){ dirty.add(id); ok = false; }
    }
    for (const id of [...delPending]){ delPending.delete(id); try { await col.doc('m_' + id).delete(); } catch(e){ delPending.add(id); ok = false; } }
    for (const id of [...attPending]){
      attPending.delete(id); const a = attCache[id] || await idbGet('att', id); if (!a || !a.data || a.data.length > CLOUD_MAX) continue;
      try { await col.doc('a_' + id).set({ kind: 'att', name: a.name || '', type: a.type || '', size: a.size || 0, w: a.w || 0, h: a.h || 0, data: a.data }); } catch(e){ attPending.add(id); ok = false; }
    }
    if (indexDirty){ indexDirty = false; try { await col.doc('index').set({ kind: 'index', order: S.order.filter(id => S.maps[id] && !S.maps[id]._sample), deleted: S.deleted.slice(-500), updatedAt: Date.now() }); } catch(e){ indexDirty = true; ok = false; } }
  } catch(e){ ok = false; }

}

}

async function importXMind(buf){
  const z = await unzip(buf); const maps = [];
  if (z.has('content.json')){
    const sheets = JSON.parse(await z.text('content.json'));
    for (const sh of sheets){
      if (!sh.rootTopic) continue; const ids = {};
      const conv = t => { const n = newNode((t.title || '').replace(/\r/g, '')); ids[t.id] = n.id;
        const note = t.notes && t.notes.plain && t.notes.plain.content; if (note && note.trim()) n.note = note.replace(/\r/g, '');
        if (t.href && /^https?:/i.test(t.href)) n.link = t.href;
        if (Array.isArray(t.labels) && t.labels.length) n.tags = parseTags(t.labels.join(' '));
        const ch = t.children || {}; n.children = (ch.attached || []).map(conv).concat((ch.detached || []).map(conv));
        if (t.branch === 'folded') n.collapsed = true; return n; };
      const m = newMap(sh.title || '시트'); m.root = conv(sh.rootTopic); m.layout = 'balanced';
      m.relations = (sh.relationships || []).filter(r => ids[r.end1Id] && ids[r.end2Id]).map(r => ({ id: uid(), from: ids[r.end1Id], to: ids[r.end2Id], label: r.title || '' }));
      maps.push(m);
    }
  } else if (z.has('content.xml')){
    const doc = new DOMParser().parseFromString(await z.text('content.xml'), 'application/xml');
    const kids = (el, name) => el ? [...el.children].filter(c => c.localName === name) : [];
    const kid = (el, name) => kids(el, name)[0];
    for (const sh of [...doc.getElementsByTagNameNS('*', 'sheet')]){
      const rt = kid(sh, 'topic'); if (!rt) continue; const ids = {};
      const conv = t => { const n = newNode((kid(t, 'title')?.textContent || '').replace(/\r/g, '')); ids[t.getAttribute('id')] = n.id;
        const note = kid(kid(t, 'notes'), 'plain')?.textContent; if (note && note.trim()) n.note = note.replace(/\r/g, '');
        const href = t.getAttributeNS('http://www.w3.org/1999/xlink', 'href') || t.getAttribute('xlink:href'); if (href && /^https?:/i.test(href)) n.link = href;
        if (t.getAttribute('branch') === 'folded') n.collapsed = true;
        const labs = kids(kid(t, 'labels'), 'label').map(l => l.textContent); if (labs.length) n.tags = parseTags(labs.join(' '));
        const ch = kid(t, 'children'); n.children = [];
        for (const tp of kids(ch, 'topics')) for (const c of kids(tp, 'topic')) n.children.push(conv(c));
        return n; };
      const m = newMap(kid(sh, 'title')?.textContent || '시트'); m.root = conv(rt);
      m.relations = kids(kid(sh, 'relationships'), 'relationship').filter(r => ids[r.getAttribute('end1')] && ids[r.getAttribute('end2')]).map(r => ({ id: uid(), from: ids[r.getAttribute('end1')], to: ids[r.getAttribute('end2')], label: kid(r, 'title')?.textContent || '' }));
      maps.push(m);
    }
  } else throw new Error('content.json / content.xml이 없어요');
  return maps;
}
